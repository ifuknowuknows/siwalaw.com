name: Build site
on:
  push:
    branches: [main]
    paths: ['site-src/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Translate changed English texts
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: python3 site-src/translate.py
      - name: Build the pages
        run: python3 site-src/build.py
      - name: Save changes
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A site-src index.html da.html es.html pt.html sv.html fr.html id.html ar.html privacy.html terms.html
          git diff --cached --quiet && exit 0
          git commit -m "Build site from English text"
          git pull --rebase origin main
          git push
